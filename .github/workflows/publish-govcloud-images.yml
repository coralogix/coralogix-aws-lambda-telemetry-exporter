name: Publish GovCloud Images

# Container images for GovCloud Lambdas deployed as container images, which can't use
# layers. The GovCloud counterpart of the DockerHub jobs in publish.yml and
# publish-combined.yml: the same docker/Dockerfile (the layer contents in /opt), pushed to
# the same DockerHub repositories with a -fips tag suffix, like the FIPS Coralogix Operator
# (coralogixrepo/coralogix-operator:<version>-fips).
#
# Built from the newest layers already public in GovCloud, so each image holds exactly the
# signed bytes customers get as layers. Run it after publish-govcloud.yml and
# publish-combined-govcloud.yml. DockerHub credentials stay in the production environment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exporter version in the GovCloud layer, e.g. 1.3.0 (exporter image tag)'
        required: true
      exporter:
        description: 'Publish the exporter image?'
        required: true
        type: boolean
      python:
        description: 'Publish the Python wrapper-and-exporter image?'
        required: true
        type: boolean
      nodejs:
        description: 'Publish the Node.js wrapper-and-exporter image?'
        required: true
        type: boolean
      java:
        description: 'Publish the Java wrapper-and-exporter image?'
        required: true
        type: boolean

# Shares the GovCloud publish lock, so an older run can't move latest-fips back after a
# newer one, or run while new layers are being published.
concurrency:
  group: publish-govcloud
  cancel-in-progress: false

jobs:

  layers:
    name: layers (${{ matrix.layer }})
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: govcloud
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        layer: ["exporter", "python", "nodejs", "java"]
        exclude:
          - layer: ${{ !inputs.exporter && 'exporter' }}
          - layer: ${{ !inputs.python && 'python' }}
          - layer: ${{ !inputs.nodejs && 'nodejs' }}
          - layer: ${{ !inputs.java && 'java' }}
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: us-gov-west-1
    # The exporter: the newest version public for both architectures in both regions. The
    # combined layers are public on publish: their newest version, checked to be public.
    - name: Download the public layers
      env:
        LAYER: ${{ matrix.layer }}
      run: |
        set -euo pipefail
        if [ "$LAYER" = exporter ]; then
          version=$(ci/govcloud/public-exporter-version.sh)
          name=coralogix-aws-lambda-telemetry-exporter
        else
          name="coralogix-$LAYER-wrapper-and-exporter"
          version=$(aws lambda list-layer-versions --layer-name "$name-x86_64" --query 'LayerVersions[0].Version')
        fi
        mkdir -p target
        for arch in x86_64 arm64; do
          aws lambda get-layer-version-policy --layer-name "$name-$arch" --version-number "$version" --query Policy --output text \
            | jq -e '.Statement[] | select(.Effect == "Allow" and .Principal == "*" and .Condition == null)' >/dev/null \
            || { echo "::error::$name-$arch v$version is not public."; exit 1; }
          url=$(aws lambda get-layer-version --layer-name "$name-$arch" --version-number "$version" --query Content.Location --output text)
          curl -sSf "$url" -o "target/$LAYER-$arch.zip"
        done
        # Matrix job outputs overwrite each other, so the version travels with the zips.
        echo "$version" > "target/$LAYER.version"
        echo "- $name v$version" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: layer-${{ matrix.layer }}
        path: |
          target/${{ matrix.layer }}-*.zip
          target/${{ matrix.layer }}.version
        if-no-files-found: error
        retention-days: 1

  images:
    name: images (${{ matrix.layer }})
    runs-on: ubuntu-22.04
    needs: [layers]
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: production
    # Uses only the DockerHub secrets; no GitHub token permissions needed.
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        layer: ["exporter", "python", "nodejs", "java"]
        exclude:
          - layer: ${{ !inputs.exporter && 'exporter' }}
          - layer: ${{ !inputs.python && 'python' }}
          - layer: ${{ !inputs.nodejs && 'nodejs' }}
          - layer: ${{ !inputs.java && 'java' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: layer-${{ matrix.layer }}
        path: target
    # Exporter: <version>-fips, like the operator. Combined images are versioned by their
    # GovCloud layer version, which differs from commercial's: gov-<version>-fips.
    - name: Set the image name and tags
      env:
        LAYER: ${{ matrix.layer }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        LAYER_VERSION=$(cat "target/$LAYER.version")
        # A single x.y.z: anything else (a comma, a newline) could add tags, e.g. overwrite a
        # commercial tag.
        [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.3.0, not '$VERSION'."; exit 1; }
        [[ $LAYER_VERSION =~ ^[0-9]+$ ]] || { echo "::error::Unexpected layer version '$LAYER_VERSION'."; exit 1; }
        if [ "$LAYER" = exporter ]; then
          image="coralogixrepo/coralogix-aws-lambda-telemetry-exporter"
          tag="$VERSION-fips"
        else
          image="coralogixrepo/coralogix-$LAYER-wrapper-and-exporter"
          tag="gov-$LAYER_VERSION-fips"
        fi
        echo "TAGS=$image:$tag,$image:latest-fips" >> "$GITHUB_ENV"
        echo "- $image:$tag (also latest-fips)" >> "$GITHUB_STEP_SUMMARY"
    - name: Prepare docker build
      run: ./scripts/prepare_docker_build.sh ${{ matrix.layer }}-x86_64.zip ${{ matrix.layer }}-arm64.zip
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: ./docker
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ env.TAGS }}
