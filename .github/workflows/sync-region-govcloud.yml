name: Synchronise GovCloud region

# The GovCloud counterpart of sync-region.yml. Copies the versions a region is missing from
# us-gov-west-1, e.g. after a publish failed part-way and check-regional-sync blocks the next
# run. Exporter versions stay private (publish-govcloud.yml makes a release public after its
# smoke test); combined layers are public on publish, so their newest version is made public
# in both regions, including one whose grant failed.

on:
  workflow_dispatch:
    inputs:
      target_region:
        description: 'GovCloud region which will get synced to us-gov-west-1'
        required: true
        default: us-gov-east-1

# Shares publish-govcloud.yml's lock: both publish layer versions, and two runs at once
# could each publish "the next" version and leave the regions out of sync.
concurrency:
  group: publish-govcloud
  cancel-in-progress: false

jobs:

  sync:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: govcloud
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check the inputs
      env:
        TARGET_REGION: ${{ inputs.target_region }}
      run: |
        [ "$TARGET_REGION" = us-gov-east-1 ] || { echo "::error::Only us-gov-east-1 can be synced from us-gov-west-1."; exit 1; }
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Sync region
      env:
        TARGET_REGION: ${{ inputs.target_region }}
      run: |
        set -euo pipefail
        account=$(aws sts get-caller-identity --query Account --output text)
        for arch in x86_64 arm64; do
          layer="coralogix-aws-lambda-telemetry-exporter-$arch"
          ./scripts/sync_layer.sh "arn:aws-us-gov:lambda:us-gov-west-1:$account:layer:$layer" \
            "arn:aws-us-gov:lambda:$TARGET_REGION:$account:layer:$layer" false false
        done
        ENVIRONMENT=govcloud ./scripts/check_exporter_layer.sh
    - name: Sync combined layers
      env:
        TARGET_REGION: ${{ inputs.target_region }}
      run: |
        set -euo pipefail
        account=$(aws sts get-caller-identity --query Account --output text)
        for runtime in python nodejs java; do
          for arch in x86_64 arm64; do
            layer="coralogix-$runtime-wrapper-and-exporter-$arch"
            # Nothing to recover for a layer never published (sync_layer.sh can't take an empty source).
            [ "$(./scripts/check_layer_version.sh "$layer" us-gov-west-1)" != 0 ] || continue
            ./scripts/sync_layer.sh "arn:aws-us-gov:lambda:us-gov-west-1:$account:layer:$layer" \
              "arn:aws-us-gov:lambda:$TARGET_REGION:$account:layer:$layer" true false
            version=$(./scripts/check_layer_version.sh "$layer" us-gov-west-1 "$TARGET_REGION")
            [ "$version" = 0 ] || ci/govcloud/ensure-public.sh "$layer" "$version"
          done
          ENVIRONMENT=govcloud RUNTIME=$runtime ./scripts/check_combined_layer.sh
        done
