name: Publish Combined Layers

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Actually publish or just test?'
        type: environment
        required: true
        default: test
      python:
        description: 'Publish Python?'
        required: true
        type: boolean
      nodejs:
        description: 'Publish Node.js?'
        required: true
        type: boolean
      java:
        description: 'Publish Java?'
        required: true
        type: boolean

jobs:

  package:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'test' }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ["python", "nodejs", "java"]
        architecture: ["x86_64", "arm64"]
        exclude:
          - runtime: ${{ !inputs.python && 'python' }}
          - runtime: ${{ !inputs.nodejs && 'nodejs' }}
          - runtime: ${{ !inputs.java && 'java' }}
    env:
      RUNTIME: ${{ matrix.runtime }}
      ARCHITECTURE: ${{ matrix.architecture }}
    outputs:
      new-layer-version: ${{ steps.version-check.outputs.NEW_LAYER_VERSION }}
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ vars.LAYER_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.LAYER_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.LAYER_AWS_DEFAULT_REGION }}
    - name: Merge layers
      run: |
        source ./scripts/set_${{ inputs.environment }}_vars.sh
        source ./scripts/merge_layers.sh
        echo "COMBINED_LAYER_NAME=$COMBINED_LAYER_NAME" >> $GITHUB_ENV
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ vars.SIGNER_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SIGNER_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.SIGNER_AWS_DEFAULT_REGION }}
    - name: Upload package to S3
      run: aws s3 cp "target/${COMBINED_LAYER_NAME}.zip" s3://${{ vars.SIGNER_BUCKET }}/to-be-signed/
    - name: Get S3 version of the uploaded file
      run: |
        LATEST_VERSION=$(aws s3api list-object-versions --bucket ${{ vars.SIGNER_BUCKET }} --prefix "to-be-signed/${COMBINED_LAYER_NAME}.zip" --query 'Versions[?IsLatest].[VersionId]' --output text)
        echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
    - name: Sign the package
      uses: clowdhaus/aws-lambda-code-signing-action@v2.0.0
      with:
        aws-region: ${{ vars.SIGNER_AWS_DEFAULT_REGION }}
        source-s3-bucket: ${{ vars.SIGNER_BUCKET }}
        source-s3-key: to-be-signed/${{ env.COMBINED_LAYER_NAME }}.zip
        source-s3-version: ${{ env.LATEST_VERSION }}
        destination-s3-bucket: ${{ vars.SIGNER_BUCKET }}
        destination-s3-prefix: signed/
        profile-name: ${{ vars.SIGNER_PROFILE_NAME }}
        max-wait-time: 60
        rename-signed-object: true
    - name: Download the signed package from S3
      run: aws s3 cp s3://${{ vars.SIGNER_BUCKET }}/signed/${COMBINED_LAYER_NAME}.zip target/${COMBINED_LAYER_NAME}.zip
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ vars.LAYER_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.LAYER_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.LAYER_AWS_DEFAULT_REGION }}
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.COMBINED_LAYER_NAME }}.zip
        path: target/${{ env.COMBINED_LAYER_NAME }}.zip
        if-no-files-found: error
        retention-days: 1

  publish-layers:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'test' }}
    needs: [package]
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ["python", "nodejs", "java"]
        architecture: ["x86_64", "arm64"]
        exclude:
          - runtime: ${{ !inputs.python && 'python' }}
          - runtime: ${{ !inputs.nodejs && 'nodejs' }}
          - runtime: ${{ !inputs.java && 'java' }}
    env:
      RUNTIME: ${{ matrix.runtime }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ vars.LAYER_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.LAYER_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.LAYER_AWS_DEFAULT_REGION }}
    - name: Set combined layer name
      run: |
        source ./scripts/set_${{ inputs.environment }}_vars.sh
        echo "COMBINED_LAYER_NAME=coralogix-${RUNTIME}-wrapper-and-exporter-${ARCHITECTURE}${NAME_SUFFIX}" >> $GITHUB_ENV
    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.COMBINED_LAYER_NAME }}.zip
        path: target
    - name: Publish layers
      run: |
        source ./scripts/set_${{ inputs.environment }}_vars.sh
        source ./scripts/publish_combined_layer.sh

  publish-to-dockerhub:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # OIDC token for the JFrog exchange
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'test' }}
    needs: [package, publish-layers] # needs to run after publish-layers as it checks layer versions (see how NEW_LAYER_VERSION is set)
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ["python", "nodejs", "java"]
        exclude:
          - runtime: ${{ !inputs.python && 'python' }}
          - runtime: ${{ !inputs.nodejs && 'nodejs' }}
          - runtime: ${{ !inputs.java && 'java' }}
    env:
      RUNTIME: ${{ matrix.runtime }}
    steps:
    - name: Set up JFrog CLI
      # Exchanges this job's GitHub OIDC JWT for a short-lived Artifactory token.
      # Replaces the JFROG_USER / JFROG_PASSWORD secret pair. The action calls
      # core.setSecret() on both outputs, so they stay masked in the log.
      id: jfrog
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://cgx.jfrog.io
      with:
        oidc-provider-name: github
        oidc-audience: jfrog-github
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ vars.LAYER_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.LAYER_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.LAYER_AWS_DEFAULT_REGION }}
    - name: Set variables
      run: |
        source ./scripts/set_${{ inputs.environment }}_vars.sh
        echo "NEW_LAYER_VERSION=`aws lambda list-layer-versions --layer-name "coralogix-${RUNTIME}-wrapper-and-exporter-x86_64${NAME_SUFFIX}" --query 'LayerVersions[0].Version'`" >> $GITHUB_ENV
        echo "IMAGE_NAME=coralogix-${RUNTIME}-wrapper-and-exporter${NAME_SUFFIX}" >> $GITHUB_ENV
        echo "X86_64_NAME=coralogix-${RUNTIME}-wrapper-and-exporter-x86_64${NAME_SUFFIX}" >> $GITHUB_ENV
        echo "ARM64_NAME=coralogix-${RUNTIME}-wrapper-and-exporter-arm64${NAME_SUFFIX}" >> $GITHUB_ENV
    - name: Download package-x86-64
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.X86_64_NAME }}.zip
        path: target
    - name: Download package-arm64
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.ARM64_NAME }}.zip
        path: target
    - name: prepare docker build
      run: ./scripts/prepare_docker_build.sh ${{ env.X86_64_NAME }}.zip ${{ env.ARM64_NAME }}.zip
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: coralogixrepo/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.NEW_LAYER_VERSION }}
          type=sha
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./docker
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: push image to jfrog
      run: |
        echo "${{ steps.jfrog.outputs.oidc-token }}" | docker login -u "${{ steps.jfrog.outputs.oidc-user }}" --password-stdin cgx.jfrog.io/coralogix-docker-images
        docker pull coralogixrepo/${{ env.IMAGE_NAME }}:${{ env.NEW_LAYER_VERSION }}
        docker tag coralogixrepo/${{ env.IMAGE_NAME }}:${{ env.NEW_LAYER_VERSION }} cgx.jfrog.io/coralogix-docker-images/${{ env.IMAGE_NAME }}:${{ env.NEW_LAYER_VERSION }}
        docker push cgx.jfrog.io/coralogix-docker-images/${{ env.IMAGE_NAME }}:${{ env.NEW_LAYER_VERSION }}
  