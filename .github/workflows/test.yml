name: Test

on: push

env:
  CARGO_TERM_COLOR: always
  PROTOFETCH_GIT_PROTOCOL: https
  PROTOFETCH_GIT_BACKEND: cli

jobs:
  build-and-test:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: /home/runner/.cargo
        key: cargo-cache-
    - name: Install protoc
      run: sudo apt install -y protobuf-compiler
    - name: Install protofetch
      run: cargo install protofetch --version 0.1.21 --locked
    - name: Check Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --all-targets -- -Dwarnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # disabled due to false-positive failures
