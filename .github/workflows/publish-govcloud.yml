name: Publish GovCloud
run-name: Publish GovCloud ${{ inputs.version }} (${{ inputs.environment }})

# The GovCloud counterpart of publish.yml: the same environment input, branches, signing
# and layer scripts. It differs where GovCloud requires it:
#   - the FIPS layer is built natively on AL2023 (ci/govcloud/build.sh);
#   - AWS access is OIDC to a role that trusts only these environments, no stored keys;
#   - layers are published private and made public only after a smoke test passes.
# Environments: govcloud-test (-test layers, never public) and govcloud (the release).
#
# Separate from publish.yml because nothing else is shared: GovCloud gets only the exporter
# layers (no SAR, Docker Hub or tag; the version is released in commercial first).
# Recover from a partial publish with sync-region-govcloud.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be published'
        required: true
      environment:
        description: 'govcloud-test or govcloud'
        type: environment
        required: true
        default: govcloud-test

concurrency:
  group: publish-govcloud-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  check-regional-sync:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'govcloud-test' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
    # The environment input lists every environment, commercial ones included.
    - name: Check the environment
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        case "$ENVIRONMENT" in
          govcloud|govcloud-test) ;;
          *) echo "::error::Choose govcloud-test or govcloud, not $ENVIRONMENT."; exit 1 ;;
        esac
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.GOVCLOUD_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Check if layer versions are in sync across regions
      run: ENVIRONMENT=${{ inputs.environment }} ./scripts/check_exporter_layer.sh

  package:
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [check-regional-sync]
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'govcloud-test' }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      SIGNER_BUCKET: ${{ vars.GOVCLOUD_SIGNING_BUCKET_PREFIX }}-us-gov-west-1
      # The bucket is shared by both environments (and possibly other workflows), so each
      # run signs under its own prefix: nothing else can replace its ZIP before signing
      # or its signed ZIP before download.
      SIGNING_PATH: ${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v4
    - name: Build the AL2023 builder image
      uses: docker/build-push-action@v7
      with:
        context: ci/govcloud
        file: ci/govcloud/Dockerfile.builder
        tags: govcloud-builder:latest
        load: true
        cache-from: type=gha,scope=govcloud-${{ matrix.arch }}
    - name: Build & package
      run: |
        docker run --rm -v "$PWD":/work -w /work govcloud-builder:latest ci/govcloud/build.sh
        sudo chown -R "$(id -u):$(id -g)" target
        # The name publish_layers.sh expects.
        mv target/package-${{ matrix.arch }}-fips.zip target/package-${{ matrix.arch }}.zip
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.GOVCLOUD_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Upload package to S3
      run: aws s3 cp "target/package-${{ matrix.arch }}.zip" "s3://$SIGNER_BUCKET/to-be-signed/$SIGNING_PATH/"
    - name: Get S3 version of the uploaded file
      run: |
        LATEST_VERSION=$(aws s3api list-object-versions --bucket "$SIGNER_BUCKET" --prefix "to-be-signed/$SIGNING_PATH/package-${{ matrix.arch }}.zip" --query 'Versions[?IsLatest].[VersionId]' --output text)
        echo "LATEST_VERSION=$LATEST_VERSION" >> "$GITHUB_ENV"
    - name: Sign the package
      uses: clowdhaus/aws-lambda-code-signing-action@v2.0.0
      with:
        aws-region: us-gov-west-1
        source-s3-bucket: ${{ env.SIGNER_BUCKET }}
        source-s3-key: to-be-signed/${{ env.SIGNING_PATH }}/package-${{ matrix.arch }}.zip
        source-s3-version: ${{ env.LATEST_VERSION }}
        destination-s3-bucket: ${{ env.SIGNER_BUCKET }}
        destination-s3-prefix: signed/${{ env.SIGNING_PATH }}/
        profile-name: ${{ vars.GOVCLOUD_SIGNER_PROFILE }}
        max-wait-time: 60
        rename-signed-object: true
    - name: Download the signed package from S3
      run: aws s3 cp "s3://$SIGNER_BUCKET/signed/$SIGNING_PATH/package-${{ matrix.arch }}.zip" "target/package-${{ matrix.arch }}.zip"
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: package-${{ matrix.arch }}.zip
        path: target/package-${{ matrix.arch }}.zip
        if-no-files-found: error
        retention-days: 1

  publish-layers:
    runs-on: ubuntu-22.04
    if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') || inputs.environment == 'govcloud-test' }}
    needs: [package]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.GOVCLOUD_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        pattern: package-*.zip
        path: target
        merge-multiple: true
    - name: Publish layers
      run: ./scripts/publish_${{ inputs.environment }}.sh
    # The new version, the same in every region and for both architectures.
    - name: Check the published version
      id: version
      run: |
        set -euo pipefail
        ENVIRONMENT=${{ inputs.environment }} ./scripts/check_exporter_layer.sh
        . ./scripts/set_${{ inputs.environment }}_vars.sh
        version=$(./scripts/check_layer_version.sh "coralogix-aws-lambda-telemetry-exporter-x86_64${NAME_SUFFIX}" "${REGULAR_REGIONS[@]}")
        echo "version=$version" >> "$GITHUB_OUTPUT"

  # Attaches each new (private) layer version to a temporary function in us-gov-west-1
  # and checks the exporter runs in FIPS mode and delivers to the Coralogix test team.
  smoke:
    name: smoke (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    needs: [publish-layers]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.GOVCLOUD_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Smoke test
      env:
        SMOKE_DOMAIN: ${{ vars.GOVCLOUD_SMOKE_DOMAIN }}
        SMOKE_BOUNDARY_ARN: ${{ vars.GOVCLOUD_SMOKE_BOUNDARY_ARN }}
        SMOKE_QUERY_KEY: ${{ secrets.GOV_SMOKE_QUERY_KEY }}
        # The attempt too, so a re-run never collides with a previous attempt's leftovers.
        SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        VERSION: ${{ needs.publish-layers.outputs.version }}
        ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        . ./scripts/set_${{ inputs.environment }}_vars.sh
        arn=$(aws lambda get-layer-version --layer-name "coralogix-aws-lambda-telemetry-exporter-${ARCH}${NAME_SUFFIX}" \
          --version-number "$VERSION" --query LayerVersionArn --output text)
        ci/govcloud/smoke.sh "$arn" us-gov-west-1 "$ARCH"

  # The release: only govcloud, only after both smoke tests pass.
  make-public:
    runs-on: ubuntu-22.04
    if: ${{ inputs.environment == 'govcloud' && ( github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release') ) }}
    needs: [publish-layers, smoke]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.GOVCLOUD_ROLE_ARN }}
        aws-region: us-gov-west-1
    - name: Make the layer versions public
      env:
        VERSION: ${{ needs.publish-layers.outputs.version }}
      run: |
        set -euo pipefail
        for arch in x86_64 arm64; do
          ENVIRONMENT=govcloud ./scripts/make_existing_layer_public.sh "coralogix-aws-lambda-telemetry-exporter-$arch" "$VERSION"
        done
    # make_existing_layer_public.sh ignores errors, so check the result.
    - name: Check they are public
      env:
        VERSION: ${{ needs.publish-layers.outputs.version }}
      run: |
        set -euo pipefail
        . ./scripts/set_govcloud_vars.sh
        for region in "${REGULAR_REGIONS[@]}"; do
          for arch in x86_64 arm64; do
            aws lambda get-layer-version-policy --region "$region" \
              --layer-name "coralogix-aws-lambda-telemetry-exporter-$arch" --version-number "$VERSION" \
              --query Policy --output text | jq -e '.Statement[] | select(.Principal == "*")' >/dev/null \
              || { echo "::error::$arch v$VERSION is not public in $region."; exit 1; }
            echo "$region $arch v$VERSION: public"
          done
        done
